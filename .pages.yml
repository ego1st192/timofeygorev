- name: news
  label: Новости обо мне
  type: file
  path: data/news.json
  format: json
  list: true
  fields:
  - name: source
    label: Издание
    type: string
  - name: date
    label: Дата
    type: date
  - name: title
    label: Заголовок статьи
    type: string
  - name: url
    label: Ссылка
    type: string
