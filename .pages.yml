    - name: text
      label: Текст
      type: object
      fields:
      - name: ru
        label: Русский
        type: text
      - name: en
        label: English
        type: text
  - name: awards
    label: Награды
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{fields.ru}'
    fields:
